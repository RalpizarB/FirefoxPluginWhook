<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    #sendButton {
      background-color: #4CAF50;
      color: white;
    }
    #sendButton:hover {
      background-color: #45a049;
    }
    #sendButton:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #saveButton {
      background-color: #008CBA;
      color: white;
    }
    #saveButton:hover {
      background-color: #007aa3;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
    #status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h2>YouTube Webhook Sender</h2>
  
  <label for="webhookUrl">Webhook URL:</label>
  <input type="url" id="webhookUrl" placeholder="https://your-webhook-url.com/endpoint">
  
  <label for="precedingString">Preceding String (optional):</label>
  <input type="text" id="precedingString" placeholder="Check this out: ">
  
  <button id="saveButton">Save Settings</button>
  <button id="sendButton">Send Current YouTube Link</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
